# Benchmark Suite Definitions
#
# This file defines the benchmark suites available in our Rust project.
# Each suite corresponds to a different aspect of byte scanning performance
# that we want to analyze across different CPU instruction sets.
#
# ## Design Philosophy
#
# Rather than hardcoding benchmark names in Python, we define them here
# so they can be easily modified and documented. In the future, this
# configuration should be automatically generated by introspecting the
# actual Rust benchmark code.
#
# ## Benchmark Structure
#
# Each benchmark suite contains:
# - name: The name used by Criterion (matches benches/*.rs file)
# - description: What this benchmark tests
# - focus_area: The primary performance characteristic being measured
# - data_characteristics: Properties of the test data
# - expected_variance: How much timing variance we expect
# - analysis_notes: Specific things to look for in results

benchmark_suites:
  bench_newlines:
    name: "bench_newlines"
    description: |
      Line-oriented text processing benchmarks.
      Tests various approaches to finding newline characters in large
      text files, which is fundamental to many text processing tasks.
    focus_area: "sequential byte scanning"
    data_characteristics:
      - "Large text files with mixed content"
      - "Variable line lengths"
      - "Realistic text patterns"
      - "Memory access patterns similar to log parsing"
    benchmark_groups:
      - name: "large texts"
        description: "Scanning large text buffers for newlines"
        operations:
          - "via_iter"
          - "via_memchr"
          - "via_u16"
          - "via_u32"
          - "via_u64"
          - "via_simd16"
          - "via_simd32"
          - "via_simd64"
      - name: "lines iterators"
        description: "Line iteration approaches for text processing"
        operations:
          - "stdlib_lines"
          - "manual_lines_iter"
          - "manual_lines_memchr"
    expected_variance: "low"
    analysis_notes: |
      Look for:
      - SIMD instructions in via_simd* variants
      - Memory access patterns in chunked approaches
      - Performance scaling with SIMD register width
      - Compiler auto-vectorization in non-SIMD variants

  bench_csv:
    name: "bench_csv"
    description: |
      Structured data parsing benchmarks.
      Tests different strategies for parsing CSV files, comparing
      nested parsing (lines first, then commas) vs flat parsing
      (coordinated newline and comma detection).
    focus_area: "multi-character scanning with coordination"
    data_characteristics:
      - "Structured CSV data with consistent field counts"
      - "Mixed data types in fields"
      - "Realistic business data patterns"
      - "Multiple scanning targets (newlines and commas)"
    benchmark_groups:
      - name: "parse full csv nested"
        description: "Two-pass parsing: find lines, then parse each line"
        operations:
          - "via_iter"
          - "via_memchr"
          - "via_u16"
          - "via_u32"
          - "via_u64"
          - "via_simd16"
          - "via_simd32"
          - "via_simd64"
      - name: "parse full csv flat"
        description: "Single-pass parsing with coordinated iterators"
        operations:
          - "via_iter"
          - "via_memchr"
          - "via_u16"
          - "via_u32"
          - "via_u64"
          - "via_simd16"
          - "via_simd32"
          - "via_simd64"
    expected_variance: "medium"
    analysis_notes: |
      Look for:
      - Performance differences between nested and flat approaches
      - SIMD effectiveness when scanning for multiple characters
      - Cache behavior differences between approaches
      - Compiler optimization of coordinated iteration

# Benchmark execution parameters
execution_parameters:
  # Default Criterion measurement settings
  measurement_time_seconds: 15
  warm_up_time_seconds: 3
  sample_sizes:
    bench_newlines: 50
    bench_csv: 100

  # Timeout settings (in seconds)
  timeout_per_benchmark: 1800 # 30 minutes per benchmark suite
  timeout_per_target: 3600 # 1 hour per target configuration

# Analysis configuration
analysis:
  # Performance metrics to focus on
  primary_metrics:
    - "throughput"
    - "latency"
    - "instructions_per_cycle"

  # Statistical analysis parameters
  confidence_level: 0.95
  outlier_detection: true
  regression_analysis: true

  # SIMD analysis configuration
  simd_analysis:
    # Reference to central instruction pattern definitions
    instruction_config_file: "instructions.yaml"

    # Quick patterns for basic SIMD detection (references patterns from instructions.yaml)
    quick_detection_patterns:
      - "quick_simd_patterns"

    # Advanced analysis patterns
    optimization_indicators:
      - "optimization_indicators"

    performance_concerns:
      - "performance_concerns"

# Future introspection configuration
# This section defines how we'll eventually auto-discover benchmarks
introspection:
  enabled: false # Set to true when introspection is implemented
  rust_project_path: "../rust_project"
  benchmark_patterns:
    - "benches/*.rs"

  # Criteria for detecting benchmark suites
  detection_criteria:
    - "Criterion benchmark groups"
    - "Function names matching bench_*"
    - "Benchmark registration patterns"

  # How to extract metadata from Rust code
  metadata_extraction:
    - "Doc comments for descriptions"
    - "Benchmark parameter analysis"
    - "Test data characteristics from code"

# Metadata about this configuration
metadata:
  version: "1.0.0"
  description: "Benchmark suite definitions for byte scanning performance analysis"
  last_updated: "2024-01-01"
  notes: |
    This configuration currently matches the existing Rust benchmark
    structure. Future versions should auto-generate this from the
    actual benchmark code to ensure consistency and reduce maintenance.
